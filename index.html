}
// グループに属するカスタム種別テンプレ一覧
function customTypesOfGroup(gid){
  return (SETTINGS.customTypes||[]).filter(c=>c.group_id===gid);
}
function customTypeById(id){
  return (SETTINGS.customTypes||[]).find(c=>c.id===id)||null;
}
// データ編集モーダルを開いたまま中身だけ描き直す
function refreshDataEditor(){
  const body=document.getElementById("mBody");
  if(body) body.innerHTML=dataEditorBody();
}

async function renameGroup(id,name){
  name=name.trim(); if(!name){ toast("グループ名を入力してください"); refreshDataEditor(); return; }
  const g=byId(DB.groups,id); g.name=name; await dbUpdate("groups",id,{name});
  toast("グループ名を更新しました");
}
async function renameMember(id,name){
  name=name.trim(); if(!name){ toast("メンバー名を入力してください"); refreshDataEditor(); return; }
  const m=byId(DB.members,id); m.name=name; await dbUpdate("members",id,{name});
  toast("メンバー名を更新しました");
}
async function toggleOshi(id){
  const m=byId(DB.members,id); const next=!m.is_oshi;
  m.is_oshi=next; await dbUpdate("members",id,{is_oshi:next});
  refreshDataEditor();
}
async function deleteMember(id){
  const m=byId(DB.members,id); if(!m) return;
  const appCount=DB.applications.filter(a=>a.member_id===id).length;
  const msg = appCount
    ? `「${m.name}」と、このメンバーの応募/当選 記録 ${appCount}件 を削除します。元に戻せません。よろしいですか?`
    : `「${m.name}」を削除します。よろしいですか?`;
  if(!confirm(msg)) return;
  await dbDelete("members",id);   // applications は FK cascade で自動削除
  DB.members=DB.members.filter(x=>x.id!==id);
  DB.applications=DB.applications.filter(a=>a.member_id!==id);
  toast("メンバーを削除しました");
  refreshDataEditor();
}
async function deleteGroup(id){
  const g=byId(DB.groups,id); if(!g) return;
  const rels=DB.releases.filter(r=>r.group_id===id);
  const relIds=rels.map(r=>r.id);
  const evs=DB.events.filter(e=>relIds.includes(e.release_id));
  const evIds=evs.map(e=>e.id);
  const sids=DB.sessions.filter(s=>evIds.includes(s.event_id)).map(s=>s.id);
  const appCount=DB.applications.filter(a=>sids.includes(a.session_id)).length;
  const msg=`グループ「${g.name}」を削除します。\n配下のリリース ${rels.length}件・開催日 ${evs.length}件・応募記録 ${appCount}件・メンバー情報 もすべて削除されます。\n元に戻せません。本当に削除しますか?`;
  if(!confirm(msg)) return;
  await dbDelete("groups",id);   // releases/events/sessions/applications/members は cascade
  // ローカルも整合させる
  DB.applications=DB.applications.filter(a=>!sids.includes(a.session_id));
  DB.sessions=DB.sessions.filter(s=>!evIds.includes(s.event_id));
  DB.events=DB.events.filter(e=>!relIds.includes(e.release_id));
  DB.releases=DB.releases.filter(r=>r.group_id!==id);
  DB.members=DB.members.filter(m=>m.group_id!==id);
  DB.groups=DB.groups.filter(x=>x.id!==id);
  // 選択中の状態が消えた可能性 → リセット
  selectedReleaseId=null; selectedEventId=null; detailMemberId=null;
  statsMemberId=null; simMemberId=null;
  toast("グループを削除しました");
  refreshDataEditor();
}

/* ---------- カスタム種別テンプレ(データ編集内) ---------- */
let _ctEditGid=null, _ctEditId=null, _ctBu=3;
function editCustomType(gid, ctId){
  _ctEditGid=gid; _ctEditId=ctId;
  const ct = ctId ? customTypeById(ctId) : null;
  const name = ct ? ct.name : "";
  _ctBu = ct ? ct.sessions.length : 3;
  const initSessions = ct ? ct.sessions : buildSchedule(Object.assign({},TEMPLATES.custom,{bu:_ctBu}));
  _ctTmpSessions = initSessions.map(s=>({
    start_time:s.start_time, end_time:s.end_time,
    receipt_open:s.receipt_open, receipt_close:s.receipt_close
  }));
  openModal(ctId?"カスタム種別を編集":"カスタム種別を追加", customTypeBody(name), async()=>{
    const nm=$("#ct_name").value.trim(); if(!nm){toast("名前を入力してください");return false;}
    // 入力値を回収
    const sessions=_ctTmpSessions.map((s,i)=>({
      bu_no:i+1,
      start_time:($("#ct_st_"+i)?.value||s.start_time.slice(0,5))+":00",
      end_time:($("#ct_en_"+i)?.value||s.end_time.slice(0,5))+":00",
      receipt_open:($("#ct_ro_"+i)?.value||s.receipt_open.slice(0,5))+":00",
      receipt_close:($("#ct_rc_"+i)?.value||s.receipt_close.slice(0,5))+":00"
    }));
    if(ctId){
      const c=customTypeById(ctId); c.name=nm; c.sessions=sessions;
    }else{
      SETTINGS.customTypes.push({id:"ct_"+Math.random().toString(36).slice(2,9), group_id:gid, name:nm, sessions});
    }
    await saveSettings();
    toast(ctId?"カスタム種別を更新しました":"カスタム種別を追加しました");
    refreshDataEditor();
    return true;
  });
  setTimeout(ctRenderRows, 30);   // モーダル描画後に各部の時刻行を構成
}
let _ctTmpSessions=[];
function customTypeBody(name){
  let h=`<div class="field"><label class="fld">名前(例: 個別握手会6部 / オンミグ8部)</label>
    <input type="text" id="ct_name" placeholder="個別握手会6部" value="${esc(name)}"></div>
    <div class="field"><label class="fld">部数</label>
      <input type="number" id="ct_bu" min="1" max="12" value="${_ctBu}" onchange="ctChangeBu(this.value)" oninput="ctChangeBu(this.value)"></div>
    <div class="field" style="margin-bottom:0"><label class="fld">各部の時刻(開始/終了/受付開始/受付締切)</label>
      <div id="ct_rows"></div></div>`;
  return h;
}
// 部数変更時に行を再構成(既存入力はできるだけ保持、超過分は計算補完)
function ctChangeBu(v){
  const n=Math.max(1,Math.min(12,parseInt(v,10)||1));
  // 現在のDOM値を _ctTmpSessions に取り込む
  _ctTmpSessions=_ctTmpSessions.map((s,i)=>({
    start_time:($("#ct_st_"+i)?.value||s.start_time.slice(0,5))+":00",
    end_time:($("#ct_en_"+i)?.value||s.end_time.slice(0,5))+":00",
    receipt_open:($("#ct_ro_"+i)?.value||s.receipt_open.slice(0,5))+":00",
    receipt_close:($("#ct_rc_"+i)?.value||s.receipt_close.slice(0,5))+":00"
  }));
  if(n>_ctTmpSessions.length){
    for(let i=_ctTmpSessions.length;i<n;i++){
      const prev=_ctTmpSessions[i-1];
      const ps=toMin(prev.start_time), pe=toMin(prev.end_time);
      const dur=Math.max(30,pe-ps), st=pe+30, en=st+dur;
      _ctTmpSessions.push({start_time:toHM(st)+":00",end_time:toHM(en)+":00",
        receipt_open:toHM(st-RECEIPT_BEFORE)+":00",receipt_close:toHM(en-RECEIPT_CUT)+":00"});
    }
  }else{
    _ctTmpSessions=_ctTmpSessions.slice(0,n);
  }
  ctRenderRows();
}
function ctRenderRows(){
  const box=$("#ct_rows"); if(!box) return;
  box.innerHTML=_ctTmpSessions.map((s,i)=>`
    <div style="border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px">
      <div style="font-weight:600;font-size:13px;margin-bottom:6px">${i+1}部</div>
      <div class="grid2">
        <div class="field" style="margin-bottom:6px"><label class="fld">開始</label>${timeField("ct_st_"+i,s.start_time.slice(0,5),"--:--")}</div>
        <div class="field" style="margin-bottom:6px"><label class="fld">終了</label>${timeField("ct_en_"+i,s.end_time.slice(0,5),"--:--")}</div>
        <div class="field" style="margin-bottom:0"><label class="fld">受付開始</label>${timeField("ct_ro_"+i,s.receipt_open.slice(0,5),"--:--")}</div>
        <div class="field" style="margin-bottom:0"><label class="fld">受付締切</label>${timeField("ct_rc_"+i,s.receipt_close.slice(0,5),"--:--")}</div>
      </div>
    </div>`).join("");
}
async function deleteCustomType(gid, ctId){
  const ct=customTypeById(ctId); if(!ct) return;
  // この種別で作られた開催日があるか
  const usedCount=DB.events.filter(e=>e.event_type===ctId).length;
  const msg=usedCount
    ? `カスタム種別「${ct.name}」を削除します。\nこの種別で作成済みの開催日 ${usedCount}件 はそのまま残りますが、種別名は表示されなくなります。よろしいですか?`
    : `カスタム種別「${ct.name}」を削除します。よろしいですか?`;
  if(!confirm(msg)) return;
  SETTINGS.customTypes=SETTINGS.customTypes.filter(c=>c.id!==ctId);
  await saveSettings();
  toast("カスタム種別を削除しました");
  refreshDataEditor();
}

function exportJSON(){
  const blob={exported:new Date().toISOString(),settings:SETTINGS,data:DB};
  const s=JSON.stringify(blob,null,2);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([s],{type:"application/json"}));
  a.download=`akushukai_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); toast("JSONを書き出しました");
}

/* =========================================================================
   ブート
   ========================================================================= */
async function boot(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){ renderAuth(); return; }
  USER=user;
  renderShell();
  const ok=await loadAll();
  if(ok) switchTab(activeTab);
}
async function init(){
  if(!window.supabase || SUPA_URL.includes("YOUR-PROJECT")){
    $("#app").innerHTML=`<div class="wrap" style="padding-top:12vh">
      <div class="card"><h3 style="color:var(--danger)">セットアップ未完了</h3>
      <p class="muted">index.html 冒頭の <code>SUPA_URL</code> と <code>SUPA_KEY</code> に、Supabase の Project URL と anon public key を貼り付けてください。</p>
      <p class="dim" style="font-size:12px">同梱の <code>supabase_schema.sql</code> を SQL Editor で実行後、このページを再読み込みしてください。</p></div></div>`;
    return;
  }
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
  sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"){ USER=null; renderAuth(); } });
  await boot();
}
window.addEventListener("DOMContentLoaded",init);
window.logout=async()=>{ await sb.auth.signOut(); };

</script>
