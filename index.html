<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ミーグリ管理">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>ミーグリ・握手会 スケジュール管理</title>
<style>
  :root{
    --bg:#12121c; --bg2:#1a1a2a; --card:#1f1f30; --card2:#26263a;
    --line:#33334a; --line2:#44445f;
    --txt:#ececf5; --txt2:#a6a6bf; --txt3:#6e6e8a;
    --acc:#c9a84a;            /* 乃木坂ゴールド系アクセント */
    --acc-d:#9c7f2c;
    --ok:#4fb286; --okbg:#16332a;
    --warn:#e0a93b; --warnbg:#3a2e15;
    --danger:#e2585a; --dangerbg:#3a1a1c;
    --info:#5b8fd4; --infobg:#16263a;
    --r:14px; --r2:10px;
    --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans); background:var(--bg); color:var(--txt);
    font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  h1,h2,h3{font-weight:600;margin:0}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  a{color:var(--info)}

  /* ---------- レイアウト ---------- */
  .wrap{max-width:760px;margin:0 auto;padding:0 16px}
  header.appbar{
    position:sticky;top:0;z-index:30;background:rgba(18,18,28,.86);
    backdrop-filter:saturate(140%) blur(12px);
    border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 0 10px;
  }
  .appbar .wrap{display:flex;align-items:center;gap:10px}
  .brand{font-size:16px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
  .sync{margin-left:auto;font-size:12px;color:var(--txt3);display:flex;align-items:center;gap:6px}
  .sync .pip{width:8px;height:8px;border-radius:50%;background:var(--txt3);transition:.3s}
  .sync.ok .pip{background:var(--ok)} .sync.saving .pip{background:var(--warn)} .sync.err .pip{background:var(--danger)}

  main{padding-top:18px}
  section.tab{display:none;animation:fade .25s ease}
  section.tab.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- ボトムナビ ---------- */
  nav.bottomnav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(20,20,32,.94);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    display:flex;justify-content:space-around;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.bottomnav button{
    background:none;border:none;color:var(--txt3);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:11px;padding:4px 7px;border-radius:10px;transition:.2s;min-width:56px;
  }
  nav.bottomnav button .ic{font-size:21px;line-height:1}
  nav.bottomnav button.active{color:var(--acc)}
  nav.bottomnav button.active .ic{transform:translateY(-1px)}

  /* ---------- カード/共通 ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  .card h3{font-size:14px;color:var(--txt2);font-weight:600;margin-bottom:12px;letter-spacing:.03em;text-transform:uppercase}
  .muted{color:var(--txt2)} .dim{color:var(--txt3)}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
  .pill.open{background:var(--okbg);color:var(--ok)}
  .pill.close{background:var(--dangerbg);color:var(--danger)}
  .pill.info{background:var(--infobg);color:var(--info)}
  .pill.gold{background:#332a12;color:var(--acc)}
  /* 種別バッジ色: オンライン系=寒色, 現場系=暖色, カスタム=中立 */
  .pill.t-kojin_online{background:#102a3a;color:#6fb6e0}    /* 個別オンライン: 青 */
  .pill.t-zenkoku_online{background:#0e2f2c;color:#5fc6b4}  /* 全国オンライン: 青緑 */
  .pill.t-real_meetgreet{background:#3a2410;color:#e0a05f}  /* リアルミーグリ: 橙 */
  .pill.t-kojin_akushu{background:#3a1518;color:#e07a86}    /* 個別握手会: 赤系 */
  .pill.t-custom{background:#2a1f3a;color:#b08fe0}          /* カスタム(ユーザー定義/旧): 紫 */
  .btn{background:var(--card2);border:1px solid var(--line2);color:var(--txt);padding:9px 14px;border-radius:var(--r2);font-size:14px;font-weight:500;transition:.15s}
  .btn:hover{background:#30304a}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#1a1505;font-weight:700}
  .btn.primary:hover{background:#d6b657}
  .btn.ghost{background:none;border-color:var(--line)}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn.danger{color:var(--danger);border-color:#5a2c2e}
  .btn:disabled{opacity:.4;pointer-events:none}
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],select{
    background:var(--bg2);border:1px solid var(--line2);color:var(--txt);
    border-radius:var(--r2);padding:9px 11px;font-size:15px;width:100%;
  }
  input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(201,168,74,.15)}
  input[type=time]{width:100%;min-width:0;min-height:42px;line-height:1.4;color:var(--txt)}
  /* ---- 日付フィールド(方法A: ネイティブinputを透明に重ね、表示は自前) ----
     iOS Safari の date 入力は空状態の見た目をCSSで制御しにくいため、
     動作(タップでネイティブの日付ホイール)はネイティブ input に任せ、
     見た目だけ .datedisp で完全に自前描画する。 */
  .datewrap{position:relative;width:100%}
  .datewrap input[type=date],.datewrap input[type=time]{
    position:absolute;inset:0;width:100%;height:100%;
    margin:0;padding:0;border:0;opacity:0;            /* 透明にして上に重ねる */
    -webkit-appearance:none;appearance:none;z-index:2;cursor:pointer;
  }
  .datewrap .datedisp{
    display:flex;align-items:center;gap:8px;
    background:var(--bg2);border:1px solid var(--line2);
    border-radius:var(--r2);padding:9px 11px;min-height:42px;
    font-size:15px;color:var(--txt);pointer-events:none;       /* タップはinputへ通す */
  }
  .datewrap .datedisp.empty{color:var(--txt3)}                  /* 未選択は淡色 */
  .datewrap .datedisp .cal{margin-left:auto;opacity:.7;font-size:16px}
  /* inputがフォーカスされたら表示枠もハイライト */
  .datewrap input[type=date]:focus + .datedisp,
  .datewrap input[type=time]:focus + .datedisp{
    border-color:var(--acc);box-shadow:0 0 0 3px rgba(201,168,74,.15)}
  label.fld{display:block;font-size:12px;color:var(--txt2);margin:0 0 5px 2px}
  .field{margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  /* グリッド項目の既定 min-width:auto により、iOSの input[type=time] 等が
     内容幅で膨らんで隣の列と重なるのを防ぐ(min-width:0 で 1fr を厳守させる) */
  .grid2>*,.grid3>*{min-width:0}
  table{width:100%;border-collapse:collapse}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000;color:#fff;
    padding:10px 18px;border-radius:24px;font-size:13px;z-index:100;opacity:0;transition:.3s;pointer-events:none;border:1px solid var(--line2)}
  .toast.show{opacity:1}
  .empty{text-align:center;color:var(--txt3);padding:34px 10px;font-size:14px}
  .empty .big{font-size:30px;display:block;margin-bottom:8px;opacity:.6}
  hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}

  /* ---------- リリース・グリッド(一覧タブ) ----------
     10年使ってきたスプレッドシートの「開催日シート」を、列を
     メンバーから開催日に置き換えた形。横スクロール + 左列固定。 */
  .gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 2px}
  table.mg{border-collapse:separate;border-spacing:0;width:auto;min-width:100%;
    font-variant-numeric:tabular-nums}
  table.mg th,table.mg td{padding:6px 7px;text-align:center;font-size:13px;white-space:nowrap;
    border-bottom:1px solid var(--line)}
  table.mg th.stick,table.mg td.stick{position:sticky;left:0;z-index:2;background:var(--card);
    text-align:left;min-width:82px;box-shadow:1px 0 0 var(--line)}
  table.mg thead th{font-size:11px;color:var(--txt2);font-weight:600;line-height:1.35}
  table.mg thead th.dt{cursor:pointer}
  table.mg thead th.dt .wd{display:block;font-weight:400;color:var(--txt3);font-size:10px}
  .wd.sun{color:#e2585a} .wd.sat{color:#5b8fd4}
  table.mg td.zero{color:var(--txt3)}
  table.mg td.has{font-weight:700}
  table.mg td.cell{cursor:pointer;position:relative}
  .cdot{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;
    background:var(--acc);box-shadow:0 0 4px rgba(201,168,74,.8)}
  table.mg td.cell:active{background:var(--card2)}
  table.mg tr.sum td{border-top:1px solid var(--line2);border-bottom:none;font-weight:700;padding-top:9px}
  table.mg tr.sum td.stick{color:var(--txt2);font-weight:600}
  table.mg td.tot,table.mg th.tot{background:var(--bg2)}
  .buchip{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
  .butime{font-size:11px;color:var(--txt3);font-weight:400;margin-left:5px}
  .segbar{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--line2);
    border-radius:var(--r2);padding:3px;margin-bottom:12px}
  .segbar button{flex:1;background:none;border:none;color:var(--txt2);font-size:13px;
    padding:7px 4px;border-radius:7px;transition:.15s}
  .segbar button.on{background:var(--card2);color:var(--txt);font-weight:600}
</style>
</head>

<script>
/* =========================================================================

   Supabase ダッシュボード → Project Settings → API から取得:
     - Project URL      → SUPA_URL
     - anon public key  → SUPA_KEY  (publishable。RLS があるので露出OK)
   ========================================================================= */

<script>
"use strict";
/* =========================================================================
   ミーグリ・握手会 スケジュール管理  —  単一ファイル・クラウド同期アプリ
   設計思想メモ準拠: クラウド先行 / RLS / JSONバックアップ / 過剰設計回避
   ========================================================================= */

/* ---------- 部スケジュール・テンプレート ---------------------------------
   各 type は { bu, dur, restAfter[], firstStart } で表現。
   restAfter[i] = i部の後の休憩(分)。受付は開始15分前〜終了15分前。   */
const RECEIPT_BEFORE = 15;   // 受付開始: 開始の何分前
const RECEIPT_CUT    = 15;   // 受付締切: 終了の何分前
const TEMPLATES = {
  kojin_online: {
    label:"個別オンラインミーグリ (5部)", group:"乃木坂46",
    bu:5, dur:90, firstStart:"10:00", restAfter:[30,60,30,30], venue:"俺ん家", online:true
  },
  kojin_akushu: {
    label:"個別握手会 (5部・従来)", group:"乃木坂46",
    bu:5, dur:90, firstStart:"10:00", restAfter:[30,60,30,30], venue:"", online:false
  },
  zenkoku_online: {
    label:"全国オンラインミーグリ (4部)", group:"乃木坂46",
    bu:4, dur:60, firstStart:"12:00", restAfter:[30,30,30], venue:"俺ん家", online:true
  },
  real_meetgreet: {
    label:"リアルミーグリ (4部)", group:"乃木坂46",
    bu:4, dur:60, firstStart:"12:00", restAfter:[30,30,30], venue:"", online:false
  },
  custom: {
    label:"カスタム (自由設定)", group:"乃木坂46",
    bu:3, dur:60, firstStart:"12:00", restAfter:[30,30], venue:"", online:false
  }
};

/* ---------- 時刻ユーティリティ ---------- */
const pad=n=>String(n).padStart(2,"0");
const toMin=t=>{ if(!t) return 0; const[h,m]=t.split(":").map(Number); return h*60+m; };
const toHM =m=>`${pad(Math.floor(m/60)%24)}:${pad(((m%60)+60)%60)}`;
function buildSchedule(tpl){
  // returns [{bu_no,start_time,end_time,receipt_open,receipt_close}]
  const out=[]; let s=toMin(tpl.firstStart);
  for(let i=0;i<tpl.bu;i++){
    const e=s+tpl.dur;
    out.push({
      bu_no:i+1,
      start_time:toHM(s)+":00",
      end_time:toHM(e)+":00",
      receipt_open:toHM(s-RECEIPT_BEFORE)+":00",
      receipt_close:toHM(e-RECEIPT_CUT)+":00",
      topic:null
    });
    if(i<tpl.bu-1) s = e + (tpl.restAfter[i]??30);
  }
  return out;
}
const EVENT_TYPE_LABEL={
  kojin_online:"個別オンライン", kojin_akushu:"個別握手会",
  zenkoku_online:"全国オンライン", real_meetgreet:"リアルミーグリ", custom:"カスタム"
};
// 種別id → 表示名。標準種別は上の辞書、ユーザー定義(ct_xxx)は SETTINGS から。
// 旧データの "custom" は「カスタム(旧)」と表示。
function typeLabel(type){
  if(!type) return "";
  if(EVENT_TYPE_LABEL[type]) return type==="custom" ? "カスタム(旧)" : EVENT_TYPE_LABEL[type];
  const ct=(SETTINGS.customTypes||[]).find(c=>c.id===type);
  return ct ? ct.name : "カスタム";
}
function isCustomType(type){ return type==="custom" || (type||"").startsWith("ct_"); }
// 種別 → バッジ色クラス。標準種別は固定色、カスタム(ユーザー定義/旧)は共通の紫。
function typePillClass(type){
  if(isCustomType(type)) return "t-custom";
  return "t-"+type;
}

/* ---------- グローバル状態 ---------- */
let sb=null, USER=null;
const DB={ groups:[],members:[],releases:[],events:[],sessions:[],applications:[],
           comp_tickets:[],release_members:[] };
let SETTINGS={ yearGoal:0, customTypes:[], typeRules:{} };  // customTypes: ユーザー定義の種別テンプレ / typeRules: 種別ごとの上限・単価
let activeTab="home";
let selectedReleaseId=null, selectedEventId=null;

/* ---------- 同期ステータス ---------- */
function setSync(state,txt){
  const el=document.getElementById("syncBadge"); if(!el) return;
  el.className="sync "+(state||"");
  el.querySelector(".lbl").textContent=txt||({ok:"同期済み",saving:"保存中…",err:"エラー"}[state]||"—");
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------- テーブル名プレフィックス -----------------------------------
   家計簿プロジェクトと同じDBに同居するため、本ツールのテーブルは mg_ 接頭。
   ローカルの DB オブジェクトのキーは接頭なしのまま、Supabase送信時のみ付与。 */
const TBL_PREFIX="mg_";
const tbl=name=>TBL_PREFIX+name;

/* ---------- データ取得(開いた時に読み込む方式) ---------- */
async function loadAll(){
  setSync("saving","読込中…");
  const tables=["groups","members","releases","events","sessions","applications",
                "comp_tickets","release_members"];
  for(const t of tables){
    const {data,error}=await sb.from(tbl(t)).select("*");
    if(error){ console.error(t,error); setSync("err"); toast("読込失敗: "+t); return false; }
    DB[t]=data||[];
  }
  const {data:st}=await sb.from(tbl("app_settings")).select("data").eq("user_id",USER.id).maybeSingle();
  if(st&&st.data) SETTINGS=Object.assign({yearGoal:0,customTypes:[],typeRules:{}},st.data);
  if(!Array.isArray(SETTINGS.customTypes)) SETTINGS.customTypes=[];
  if(!SETTINGS.typeRules || typeof SETTINGS.typeRules!=="object") SETTINGS.typeRules={};
  setSync("ok"); 
  return true;
}

/* ---------- 汎用 upsert / insert / delete(楽観的更新は呼び出し側) ----------
   呼び出し側は接頭なしの論理名("events"等)を渡す。ここで mg_ を付ける。 */
async function dbInsert(table,row){
  row.user_id=USER.id;
  const {data,error}=await sb.from(tbl(table)).insert(row).select().single();
  if(error){ setSync("err"); toast("保存失敗"); throw error; }
  setSync("ok"); return data;
}
async function dbUpdate(table,id,patch){
  setSync("saving");
  const {data,error}=await sb.from(tbl(table)).update(patch).eq("id",id).select().single();
  if(error){ setSync("err"); toast("更新失敗"); throw error; }
  setSync("ok"); return data;
}
async function dbDelete(table,id){
  setSync("saving");
  const {error}=await sb.from(tbl(table)).delete().eq("id",id);
  if(error){ setSync("err"); toast("削除失敗"); throw error; }
  setSync("ok");
}
async function saveSettings(){
  setSync("saving");
  await sb.from(tbl("app_settings")).upsert({user_id:USER.id,data:SETTINGS,updated_at:new Date().toISOString()});
  setSync("ok");
}

/* ---------- 派生ヘルパ ---------- */
const byId=(arr,id)=>arr.find(x=>x.id===id);
const sessionsOf=eid=>DB.sessions.filter(s=>s.event_id===eid).sort((a,b)=>a.bu_no-b.bu_no);
// 応募行(メンバー×部×回次)。session単位 / session×member単位 で取得。
const appsOf=sid=>DB.applications.filter(a=>a.session_id===sid);
const appsOfSM=(sid,mid)=>DB.applications.filter(a=>a.session_id===sid&&a.member_id===mid).sort((a,b)=>a.round-b.round);
// その部の当選合計(全メンバー)。homeや一覧の「当選枚数」表示用。
// 無敵券も「その日持っている枚数」なので保有系の合計には含める。
const wonOfSession=sid=>appsOf(sid).reduce((n,a)=>n+(a.won||0),0);

/* ---------- 無敵券(メンバー欠席の振替券) ----------
   抽選を経ていないので、当選率の分子・分母どちらにも入れてはいけない。
   費用(個握券)にも含めない。保有枚数にだけ効く。
   残高 = 発行合計 − 使用合計。有効期限は実質なし(卒業まで)。 */
const isComp = a => a.kind === "comp";
const compIssued = mid => DB.comp_tickets
  .filter(t=>t.member_id===mid).reduce((n,t)=>n+(t.qty||0),0);
const compUsed = mid => DB.applications
  .filter(a=>isComp(a)&&a.member_id===mid).reduce((n,a)=>n+(a.won||0),0);
const compBalance = mid => compIssued(mid)-compUsed(mid);
// 発行または使用の記録があるメンバー(卒業者は残高が使えないので除く)
function membersWithComp(){
  return DB.members.filter(m=>!m.is_graduated && (compIssued(m.id)>0||compUsed(m.id)>0));
}

/* ---------- 完売(リリース × メンバー) ----------
   完売の速さはメンバーごとに違う。完売後に増える枚数は抽選由来ではないが、
   無敵券は完売前にも使えるため自動判定はせず、入力ボタンの既定を変えるだけ。 */
const soldOutRow = (rid,mid) => DB.release_members.find(x=>x.release_id===rid&&x.member_id===mid)||null;
const isSoldOut  = (rid,mid) => !!(soldOutRow(rid,mid)||{}).sold_out;
// そのイベントに登場するメンバーID一覧(応募行があるメンバー)。
const membersInEvent=eid=>{
  const set=new Set();
  sessionsOf(eid).forEach(s=>appsOf(s.id).forEach(a=>set.add(a.member_id)));
  return [...set];
};
const eventsOf=rid=>DB.events.filter(e=>e.release_id===rid).sort((a,b)=>(a.event_date>b.event_date?1:-1));
function memberName(id){ const m=byId(DB.members,id); return m?m.name:"?"; }
function releaseLabel(id){ const r=byId(DB.releases,id); return r?r.label:"?"; }
function membersOfGroup(gid){ return DB.members.filter(m=>m.group_id===gid).sort((a,b)=>a.sort_order-b.sort_order); }

/* ---- 日付フィールド(方法A) ----
   ネイティブ input[type=date] を透明に重ね、見た目は .datedisp で自前描画。
   どの端末でも「年/月/日 と 📅」が必ず見え、タップでネイティブのピッカーが出る。 */
function dateField(id, value, placeholder){
  const v=value||"";
  const disp=v?formatDateDisp(v):(placeholder||"日付を選択");
  const ph=esc(placeholder||"日付を選択");
  return `<div class="datewrap">
    <input type="date" id="${id}" value="${v}"
      onclick="openPicker(this)"
      oninput="syncDateDisp('${id}','${ph}')"
      onchange="syncDateDisp('${id}','${ph}')">
    <div class="datedisp ${v?"":"empty"}" id="${id}_disp">
      <span class="txt">${esc(disp)}</span><span class="cal">\u{1F4C5}</span>
    </div>
  </div>`;
}
// PC Chrome は input 本体クリックでカレンダーが開かないため showPicker() を明示呼び出し
function openPicker(inp){
  try{ if(typeof inp.showPicker==="function") inp.showPicker(); }
  catch(e){ /* ユーザー操作外などで弾かれた場合は何もしない(focusで代替) */ }
}
function formatDateDisp(ymd){
  // YYYY-MM-DD → YYYY年M月D日(曜)
  const d=new Date(ymd+"T00:00:00"); if(isNaN(d)) return ymd;
  const w=["日","月","火","水","木","金","土"][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${w})`;
}
function syncDateDisp(id, placeholder){
  const inp=document.getElementById(id), box=document.getElementById(id+"_disp");
  if(!inp||!box) return;
  const v=inp.value;
  box.querySelector(".txt").textContent = v?formatDateDisp(v):(placeholder||"日付を選択");
  box.classList.toggle("empty", !v);
}

/* ---- 時刻フィールド(日付と同じ方法A) ----
   iOS Safari の input[type=time] は時計アイコンも出ず幅も崩れるため、
   透明な input を重ね、表示は .datedisp(流用)で自前描画。アイコンは🕐。 */
function timeField(id, value, placeholder){
  const v=value||"";
  const disp=v||(placeholder||"--:--");
  const ph=esc(placeholder||"--:--");
  return `<div class="datewrap">
    <input type="time" id="${id}" value="${v}"
      onclick="openPicker(this)"
      oninput="syncTimeDisp('${id}','${ph}')"
      onchange="syncTimeDisp('${id}','${ph}')">
    <div class="datedisp ${v?"":"empty"}" id="${id}_disp">
      <span class="txt">${esc(disp)}</span><span class="cal">\u{1F551}</span>
    </div>
  </div>`;
}
function syncTimeDisp(id, placeholder){
  const inp=document.getElementById(id), box=document.getElementById(id+"_disp");
  if(!inp||!box) return;
  const v=inp.value;
  box.querySelector(".txt").textContent = v||(placeholder||"--:--");
  box.classList.toggle("empty", !v);
}

function miniStat(label,val){
  return `<div style="background:var(--bg2);border-radius:10px;padding:11px">
    <div class="dim" style="font-size:11px">${label}</div>
    <div style="font-size:19px;font-weight:700;margin-top:2px">${val}</div></div>`;
}
function daysLeft(ymd){
  const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(ymd+"T00:00:00");
  return Math.round((d-t)/86400000);
}
function yearStats(year){
  // won = 保有(参加)枚数なので無敵券も含む。当選率は抽選分だけで出す。
  let won=0,events=0,applied=0,lotWon=0;
  DB.events.forEach(e=>{
    if(!e.event_date.startsWith(year+"-")) return;
    events++;
    sessionsOf(e.id).forEach(s=>{
      appsOf(s.id).forEach(ap=>{
        won+=ap.won||0;
        if(!isComp(ap)){ applied+=ap.applied||0; lotWon+=ap.won||0; }
      });
    });
  });
  return {won,events,rate:applied?Math.round(lotWon/applied*100)+"%":"—"};
}
function startCountdown(list){
  if(countdownTimer) clearInterval(countdownTimer);
  const tick=()=>{
    const box=$("#cdList"); if(!box){clearInterval(countdownTimer);return;}
    const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
    box.innerHTML=list.map(({e,s,won})=>{
      const cut=toMin(s.receipt_close);
      const diff=cut-nowMin;
      let cls="info",txt="";
      if(diff<=0){ cls="close"; txt="締切終了"; }
      else { const h=Math.floor(diff/60),m=Math.floor(diff%60),sec=Math.floor((diff*60)%60);
        txt=`${h>0?h+"時間":""}${pad(m)}分${pad(sec)}秒`; if(diff<=30) cls="close"; else if(diff<=60) cls="open"; }
      return `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)">
        <div class="grow">
          <div style="font-weight:600">${s.bu_no}部 <span class="dim" style="font-weight:400">${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)}</span></div>
          <div class="dim" style="font-size:12px">締切 ${s.receipt_close.slice(0,5)} ・ ${esc(memberWonStr(s.id))} ・ 当選${won}枚</div>
        </div>
        <div style="text-align:right">
          <div class="pill ${cls}" style="font-variant-numeric:tabular-nums;font-size:14px;padding:5px 11px">${txt}</div>
        </div></div>`;
    }).join("");
  };
  tick(); countdownTimer=setInterval(tick,1000);
}
function memberWonStr(sid){
  const byMem={};
  appsOf(sid).forEach(a=>{ if(a.won>0) byMem[a.member_id]=(byMem[a.member_id]||0)+a.won; });
  const a=Object.entries(byMem).map(([mid,w])=>`${memberName(mid)}${w}`);
  return a.join(" ")||"—";
}

    <div class="grid2">
      <div class="field"><label class="fld">開催日</label>${dateField("m_edate","","開催日を選択")}</div>
      <div class="field"><label class="fld">会場(俺ん家=オンライン)</label><input type="text" id="m_venue" value="俺ん家"></div>
    </div>

  `,async()=>{

    const type=$("#m_type").value;
    const ev=await dbInsert("events",{release_id:rid,event_date:edate,event_type:type,venue:$("#m_venue").value||""});
    DB.events.push(ev);
    for(const s of currentPreviewSessions(type)){
      const srow=await dbInsert("sessions",Object.assign({event_id:ev.id},s));
      DB.sessions.push(srow);
    }
    toast("開催日と部を作成しました"); selectedEventId=ev.id; return true;
  });
  setTimeout(()=>{ const t=$("#m_type"); if(t){ previewSched(); } },30);
}
// 現在のプレビュー内容(=作成される部)を返す。
//  - 標準種別: TEMPLATESの固定スケジュール
//  - ユーザー定義カスタム種別(ct_xxx): そのテンプレの部構成
function currentPreviewSessions(type){
  const ct=customTypeById(type);
  if(ct){
    return ct.sessions.map((s,i)=>({
      bu_no:i+1, start_time:s.start_time, end_time:s.end_time,
      receipt_open:s.receipt_open, receipt_close:s.receipt_close, topic:null
    }));
  }
  return buildSchedule(TEMPLATES[type]||TEMPLATES.kojin_online);
}
function previewSched(){
  const type=$("#m_type").value;
  const box=$("#m_sched"); if(!box) return;
  const v=$("#m_venue"); const tplOnline=TEMPLATES[type]?.online;
  if(v && tplOnline && v.value==="") v.value="俺ん家";
  box.innerHTML=currentPreviewSessions(type).map(s=>
    `<div class="row" style="padding:3px 0"><span style="width:40px;font-weight:600">${s.bu_no}部</span>
     <span class="grow">${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)}</span>
     <span class="pill close" style="font-size:10px">締切 ${s.receipt_close.slice(0,5)}</span></div>`).join("");
}

/* ---------- イベント詳細(対象メンバー × 部ごとの入力) ----------

   各部カードにそのメンバーの回次別 申請/当選 を入力する。 */
let detailMemberId=null;  // 現在表示中の対象メンバー
function renderEventDetail(el){

    <div class="row" style="gap:8px">
      <select id="detailMember" onchange="changeDetailMember(this.value)" class="grow">

        ${groupMembers.map(m=>`<option value="${m.id}" ${m.id===detailMemberId?"selected":""}>${esc(m.name)}${m.is_oshi?" ★":""}</option>`).join("")}

        <button class="btn sm ${sold?"primary":"ghost"}" onclick="toggleSoldOut('${e.release_id}')">

        <span class="dim" style="font-size:11px;margin-left:auto">無敵券 残 <b style="color:${bal>0?"var(--acc)":"var(--txt3)"}">${bal}</b>枚</span>
      </div>`;})():""}
    <p class="dim" style="font-size:11px;margin:8px 0 0">応募・当選はこのメンバーの記録として保存されます。完売にすると、各部の入力ボタンが「無敵券」優先に切り替わります。</p>
  </div>`;

  if(!detailMemberId){
    html+=`<div class="card"><div class="empty">メンバーがいません。上の「＋ 新しいメンバー…」で追加してください。</div></div>`;
    el.innerHTML=html; return;
  }

  // --- 部ごとカード(対象メンバーの回次別 申請/当選) ---
  ss.forEach(s=>{
    const apps=appsOfSM(s.id,detailMemberId);
    const wonTotal=apps.reduce((n,a)=>n+(a.won||0),0);            // 保有枚数(無敵券込み)
    const lot=apps.filter(a=>!isComp(a));
    const appTotal=lot.reduce((n,a)=>n+(a.applied||0),0);
    const lotWon  =lot.reduce((n,a)=>n+(a.won||0),0);
    const compWon =wonTotal-lotWon;
    const rateAll=appTotal?Math.round(lotWon/appTotal*100):null;   // 当選率は抽選分のみ
    html+=`<div class="card">
      <div class="row">
        <h3 style="text-transform:none;color:var(--txt);font-size:15px">${s.bu_no}部
          <span class="dim" style="font-weight:400;font-size:13px">${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)}</span></h3>
        <span class="pill close" style="margin-left:auto">締切 ${s.receipt_close.slice(0,5)}</span>

      </div>

          <td style="padding:4px 0">${a.round}次</td>
          <td style="text-align:center"><input type="number" min="0" value="${a.applied}" style="width:60px;text-align:center;padding:5px"

          <td style="text-align:center"><input type="number" min="0" value="${a.won}" style="width:60px;text-align:center;padding:5px"
              onchange="updApp('${a.id}','won',this.value)"></td>
          <td style="text-align:center;font-weight:600;color:${a.applied?(a.won/a.applied>=.5?'var(--ok)':a.won/a.applied>=.3?'var(--warn)':'var(--danger)'):'var(--txt3)'}">

          <td style="text-align:right"><button class="btn sm ghost danger" style="padding:3px 7px" onclick="delApp('${a.id}')">×</button></td>

        ${isSoldOut(e.release_id,detailMemberId)

             <button class="btn sm ghost" onclick="addApp('${s.id}')">＋ 回次</button>`

    title="部を追加" onclick="addSession('${e.id}')">＋</button>`;

  el.innerHTML=html;

// 末尾に部を1つ追加。直前の部の終了時刻+30分から、その部の長さ分で自動計算。
async function addSession(eid){
  const ss=sessionsOf(eid);
  const last=ss[ss.length-1];
  let start, end;
  if(last){
    const lastStart=toMin(last.start_time), lastEnd=toMin(last.end_time);
    const dur=Math.max(30, lastEnd-lastStart);   // 直前の部と同じ長さ
    start=lastEnd+30; end=start+dur;              // 休憩30分後に開始
  }else{
    start=toMin("12:00"); end=start+60;
  }
  const row=await dbInsert("sessions",{
    event_id:eid, bu_no:(last?last.bu_no:0)+1,
    start_time:toHM(start)+":00", end_time:toHM(end)+":00",
    receipt_open:toHM(start-RECEIPT_BEFORE)+":00", receipt_close:toHM(end-RECEIPT_CUT)+":00",
    topic:null
  });
  DB.sessions.push(row); renderEvents();
}
// 部を削除(その部の応募/当選も消える)。最後の1部は消せない。
async function deleteSession(sid){
  const s=byId(DB.sessions,sid); if(!s) return;
  const sameEvent=sessionsOf(s.event_id);
  if(sameEvent.length<=1){ toast("最後の部は削除できません"); return; }
  const appCount=appsOf(sid).length;
  const msg=appCount
    ? `${s.bu_no}部 と、この部の応募/当選 記録 ${appCount}件 を削除します。よろしいですか?`
    : `${s.bu_no}部 を削除します。よろしいですか?`;
  if(!confirm(msg)) return;
  await dbDelete("sessions",sid);   // applications は cascade
  DB.sessions=DB.sessions.filter(x=>x.id!==sid);
  DB.applications=DB.applications.filter(a=>a.session_id!==sid);
  toast("部を削除しました"); renderEvents();
}
async function changeDetailMember(v){
  if(v==="__none"){ return; }   // プレースホルダ選択時は何もしない
  if(v==="__new"){
    const name=prompt("メンバー名を入力(例: 遠藤さくら)");
    if(!name){ renderEvents(); return; }
    const gid=byId(DB.releases, byId(DB.events,selectedEventId).release_id).group_id;
    const m=await dbInsert("members",{group_id:gid,name:name.trim(),is_oshi:false,sort_order:DB.members.length});
    DB.members.push(m); detailMemberId=m.id;
  }else{
    detailMemberId=v;
  }
  renderEvents();
}

/* ---------- 入力ハンドラ(楽観的更新) ---------- */
async function updTopic(sid,v){ const s=byId(DB.sessions,sid); s.topic=v; await dbUpdate("sessions",sid,{topic:v}); }
async function updApp(id,field,v){
  const a=byId(DB.applications,id); a[field]=+v||0; renderEvents();
  // 無敵券は発行済み残高を超えて使えない。発行の登録漏れもあり得るので保存はする。
  if(isComp(a)&&field==="won"&&compBalance(a.member_id)<0)
    toast(`無敵券の残高を ${-compBalance(a.member_id)}枚 超えています`);
  await dbUpdate("applications",id,{[field]:+v||0});
}
async function addApp(sid){
  if(!detailMemberId){ toast("対象メンバーを選んでください"); return; }
  const ex=appsOfSM(sid,detailMemberId).filter(a=>!isComp(a)).map(a=>a.round);
  let r=1; while(ex.includes(r)) r++;
  const row=await dbInsert("applications",{session_id:sid,member_id:detailMemberId,round:r,applied:0,won:0,kind:"lottery"});
  DB.applications.push(row); renderEvents();
}
// 無敵券の行。抽選を経ないので round は 0、申請は常に 0(DB側のCHECKと一致)。
async function addComp(sid){
  if(!detailMemberId){ toast("対象メンバーを選んでください"); return; }
  if(appsOfSM(sid,detailMemberId).some(isComp)){ toast("この部には既に無敵券の行があります"); return; }
  const row=await dbInsert("applications",{session_id:sid,member_id:detailMemberId,round:0,applied:0,won:0,kind:"comp"});
  DB.applications.push(row); renderEvents();
}
// 完売の切替。オンにするとき、そのリリースでこのメンバーが応募した最大回次を記録する。
async function toggleSoldOut(rid){
  if(!detailMemberId) return;
  const cur=soldOutRow(rid,detailMemberId);
  const next=!(cur&&cur.sold_out);
  let maxRound=null;
  if(next){
    eventsOf(rid).forEach(ev=>sessionsOf(ev.id).forEach(s=>
      appsOfSM(s.id,detailMemberId).forEach(a=>{
        if(!isComp(a)&&(a.applied||0)>0) maxRound=Math.max(maxRound||0,a.round);
      })));
  }
  const patch={sold_out:next, sold_out_round:next?maxRound:null, updated_at:new Date().toISOString()};
  if(cur){ Object.assign(cur,patch); await dbUpdate("release_members",cur.id,patch); }
  else{
    const row=await dbInsert("release_members",Object.assign({release_id:rid,member_id:detailMemberId},patch));
    DB.release_members.push(row);
  }
  toast(next?"完売にしました":"完売を解除しました"); renderEvents();
}
async function delApp(id){ DB.applications=DB.applications.filter(a=>a.id!==id); renderEvents(); await dbDelete("applications",id); }

function editTimes(sid){
  const s=byId(DB.sessions,sid);
  openModal(`${s.bu_no}部 時刻編集`,`
    <div class="grid2">
      <div class="field"><label class="fld">開始</label>${timeField("t_start",s.start_time.slice(0,5),"--:--")}</div>
      <div class="field"><label class="fld">終了</label>${timeField("t_end",s.end_time.slice(0,5),"--:--")}</div>
      <div class="field"><label class="fld">受付開始</label>${timeField("t_ro",s.receipt_open?.slice(0,5)||"","--:--")}</div>
      <div class="field"><label class="fld">受付締切</label>${timeField("t_rc",s.receipt_close?.slice(0,5)||"","--:--")}</div>
    </div>
    <p class="dim" style="font-size:11px">空欄のままにすると、開始/終了から15分ルールで自動補完します。</p>
  `,async()=>{
    const st=$("#t_start").value, en=$("#t_end").value;
    const ro=$("#t_ro").value || toHM(toMin(st)-RECEIPT_BEFORE);
    const rc=$("#t_rc").value || toHM(toMin(en)-RECEIPT_CUT);
    const patch={start_time:st+":00",end_time:en+":00",receipt_open:ro+":00",receipt_close:rc+":00"};

async function delEvent(id){
  if(!confirm("この開催日と紐づく部・応募・当選をすべて削除します。よろしいですか?")) return;
  await dbDelete("events",id);
  DB.events=DB.events.filter(e=>e.id!==id);
  const sids=DB.sessions.filter(s=>s.event_id===id).map(s=>s.id);
  DB.sessions=DB.sessions.filter(s=>s.event_id!==id);
  DB.applications=DB.applications.filter(a=>!sids.includes(a.session_id));
  selectedEventId=null; renderEvents();
}
async function delRelease(id){
  if(!confirm("このリリースと配下の全データを削除します。よろしいですか?")) return;
  await dbDelete("releases",id);
  DB.releases=DB.releases.filter(r=>r.id!==id);
  DB.events=DB.events.filter(e=>e.release_id!==id);
  renderEvents();
}


/* =========================================================================
   種別ごとの制度差(支払いの向き・当選上限・単価)
   個別      : 当選した枚数だけ後から 1200円 の CD を買う。当選上限なし。
               (代わりに回次ごとの申請上限がある)
   全国/リアル: 先に CD を買い、同梱シリアルで応募する。申請上限は無いが
               1部あたりの当選上限があり、超えて入れた分はそのまま無駄になる。
   ルールは稀に変わるのでデータで持ち、データ編集から変更できるようにする。
   ========================================================================= */
const TYPE_RULES_DEFAULT={
  kojin_online:   {payment:"post", unitPrice:1200, winCap:null},
  kojin_akushu:   {payment:"post", unitPrice:1200, winCap:null},
  zenkoku_online: {payment:"pre",  unitPrice:1653, winCap:10},
  real_meetgreet: {payment:"pre",  unitPrice:1653, winCap:10},
  custom:         {payment:"post", unitPrice:null, winCap:null}
};
function typeRule(type){
  const ct=customTypeById(type);
  if(ct) return Object.assign({payment:"post",unitPrice:null,winCap:null}, ct.rule||{});
  return Object.assign({}, TYPE_RULES_DEFAULT[type]||TYPE_RULES_DEFAULT.custom,
                       (SETTINGS.typeRules||{})[type]||{});
}
// 上限に届かせるのに要る枚数。上限が無い/実績が無いときは null。
function needForCap(rate,cap){
  return (cap!=null && rate>0) ? Math.ceil(cap/rate) : null;
}
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");

/* ---------- 種別の設定エディタ(データ編集の先頭に1回だけ) ---------- */
function typeRulesEditorHtml(){
  const keys=["kojin_online","kojin_akushu","zenkoku_online","real_meetgreet"];

    <div class="dim" style="font-size:11px;margin-bottom:8px">種別の設定(当選上限・単価・支払い)</div>

      const r=typeRule(k);
      return `<div style="padding:6px 0;border-bottom:1px solid var(--line)">

        <div class="row" style="gap:6px">
          <span class="dim" style="font-size:11px;width:56px">当選上限</span>

            style="width:74px;padding:5px;font-size:13px">

          <input type="number" id="tr_pr_${k}" min="0" value="${r.unitPrice??""}"
            style="width:82px;padding:5px;font-size:13px">
          <select id="tr_pay_${k}" style="padding:5px;font-size:13px;width:auto">
            <option value="post" ${r.payment==="post"?"selected":""}>後払い</option>
            <option value="pre"  ${r.payment==="pre" ?"selected":""}>先払い</option>
          </select>
        </div></div>`;
    }).join("")}
    <p class="dim" style="font-size:11px;margin:8px 0 6px">先払い(全国/リアル)は落選するとCD代が無駄になるため、応募計算で過剰分の金額を出します。当選上限を空にすると上限なしとして扱います。</p>
    <button class="btn sm ghost" onclick="saveTypeRules()">種別の設定を保存</button>
  </div>`;
}
async function saveTypeRules(){
  const keys=["kojin_online","kojin_akushu","zenkoku_online","real_meetgreet"];
  const out={};
  keys.forEach(k=>{
    const cap=document.getElementById("tr_cap_"+k).value.trim();
    const pr =document.getElementById("tr_pr_"+k).value.trim();
    out[k]={ winCap: cap===""?null:+cap,
             unitPrice: pr===""?null:+pr,
             payment: document.getElementById("tr_pay_"+k).value };
  });
  SETTINGS.typeRules=out;
  await saveSettings();
  toast("種別の設定を保存しました");
}

/* =========================================================================
   週次の申込サイクル
   乃木坂の個別ミーグリは週単位で回る。木15:00に申込が開き、金14:00に締切、
   金18:00以降に当落発表。翌週の木にまた開く ——「回次」はこの週の順番。
   無敵券だけは別サイクルで、開催週の水曜に、その週の開催分に対してのみ
   申し込める(時刻締切ではなく先着で、部が埋まると閉まる)。
   AKBなど他グループはスケジュールが違うので mg_groups.config.cycle に持つ。
   ========================================================================= */
const DEFAULT_CYCLE={
  lottery:{ open_dow:4, open_time:"15:00",     // 木 15:00 申込開始
            close_dow:5, close_time:"14:00",   // 金 14:00 締切
            result_dow:5, result_time:"18:00" },// 金 18:00 当落発表
  comp:{ dow:3 }                                // 水 無敵券(その週の開催分・先着)
};
const DOW_LABEL=["日","月","火","水","木","金","土"];
function cycleOf(gid){
  const c=((byId(DB.groups,gid)||{}).config||{}).cycle||{};
  return { lottery:Object.assign({},DEFAULT_CYCLE.lottery,c.lottery||{}),
           comp:   Object.assign({},DEFAULT_CYCLE.comp,   c.comp||{}) };
}
// 指定の曜日・時刻の「次の」日時。その時刻を既に過ぎていれば来週になる。
function nextDow(dow,hm,from){
  const [h,m]=String(hm||"00:00").split(":").map(Number);
  const t=new Date(from); t.setHours(h,m,0,0);
  t.setDate(t.getDate()+((dow-from.getDay()+7)%7));
  if(t<=from) t.setDate(t.getDate()+7);
  return t;
}
// 月曜起点の週の頭
function weekStart(d){
  const x=new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate()-((x.getDay()+6)%7)); return x;
}
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();

/* 申込フェーズの判定。
   「次の締切」が「次の開始」より近ければ、いまは受付中ということ。
   同様に「次の発表」が「次の開始」より近ければ、締切後〜発表待ち。 */
function lotteryPhase(L,now){
  const open=nextDow(L.open_dow,L.open_time,now);
  const close=nextDow(L.close_dow,L.close_time,now);
  const result=nextDow(L.result_dow,L.result_time,now);
  if(close<open)  return {key:"open",   at:close,  title:"通常申込 締切", cls:"close"};
  if(result<open) return {key:"result", at:result, title:"当落発表",      cls:"info"};
  return               {key:"wait",   at:open,   title:"通常申込 開始", cls:"open"};
}
function untilStr(ms){
  if(ms<=0) return "まもなく";
  const s=Math.floor(ms/1000), d=Math.floor(s/86400),
        h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60), sec=s%60;
  if(d>0) return `${d}日 ${h}時間`;
  if(h>0) return `${h}時間 ${pad(m)}分`;
  return `${m}分 ${pad(sec)}秒`;
}

/* カード描画に必要な文脈。直近の開催が無ければ null(カードごと出さない)。 */
function weeklyCtx(){
  const now=new Date();
  const ymd=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const up=DB.events.filter(e=>e.event_date>=ymd).sort((a,b)=>a.event_date>b.event_date?1:-1);
  if(!up.length) return null;
  const rel=byId(DB.releases,up[0].release_id);
  const gid=rel?rel.group_id:null;
  const cyc=cycleOf(gid);
  // 今週(月〜日)の開催 = 無敵券の対象
  const ws=weekStart(now), we=new Date(ws); we.setDate(ws.getDate()+7);
  const thisWeek=up.filter(e=>{const d=new Date(e.event_date+"T00:00:00");return d>=ws&&d<we;});
  const wed=new Date(ws); wed.setDate(ws.getDate()+((cyc.comp.dow+6)%7));
  // 残高のある(=使える)メンバー
  const compMem=DB.members.filter(m=>!m.is_graduated&&compBalance(m.id)>0);
  // そのリリースでまだ完売していないメンバー
  const relMems=rel?membersInRelease(rel.id):[];
  const stillOpen=relMems.filter(mid=>!isSoldOut(rel.id,mid));
  return {now,rel,gid,cyc,thisWeek,wed,compMem,relMems,stillOpen};
}

function weeklyCardHtml(){
  if(!weeklyCtx()) return "";
  return `<div class="card"><div class="row" style="margin-bottom:4px">
      <h3 style="margin:0">今週の申込</h3>
      <span class="dim" id="wkHead" style="margin-left:auto;font-size:11px"></span>
    </div><div id="wkList"></div></div>`;
}

let weeklyTimer=null;
function startWeekly(){
  if(weeklyTimer) clearInterval(weeklyTimer);
  tickWeekly(); weeklyTimer=setInterval(tickWeekly,1000);
}
function tickWeekly(){
  const box=document.getElementById("wkList");
  if(!box){ if(weeklyTimer) clearInterval(weeklyTimer); weeklyTimer=null; return; }
  const c=weeklyCtx(); if(!c){ box.innerHTML=""; return; }
  const now=new Date(), L=c.cyc.lottery;
  const head=document.getElementById("wkHead");
  if(head) head.textContent=[(byId(DB.groups,c.gid)||{}).name, c.rel&&c.rel.label].filter(Boolean).join(" ・ ");

  let h="";

  // --- 無敵券: 開催週の水曜・その週の開催分のみ・先着 ---
  // 残高が無い/今週に開催が無い ときは出さない(毎週出ると意味が薄れるため)
  if(c.compMem.length && c.thisWeek.length){
    const today0=new Date(now); today0.setHours(0,0,0,0);
    const isToday=sameDay(c.wed,now), past=c.wed<today0;
    const names=c.compMem.map(m=>`${m.name} 残${compBalance(m.id)}枚`).join(" / ");
    const tgt=c.thisWeek.map(e=>{const x=mdw(e.event_date);return `${x.md}(${x.wd})`;}).join(" ");
    h+=`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)">
      <div class="grow">
        <div style="font-weight:600">${DOW_LABEL[c.cyc.comp.dow]} 無敵券 申込
          <span class="pill close" style="margin-left:5px;font-size:10px">先着</span></div>
        <div class="dim" style="font-size:12px">${esc(names)} → ${esc(tgt)} の開催分</div>
      </div>
      <div class="pill ${isToday?"close":past?"info":"gold"}" style="font-size:13px;padding:5px 11px">
        ${isToday?"本日":past?"受付終了":"あと "+Math.ceil((c.wed-today0)/86400000)+"日"}</div>
    </div>`;
  }

  // --- 通常申込(抽選) ---
  if(c.relMems.length && !c.stillOpen.length){
    h+=`<div class="row" style="padding:10px 0">
      <div class="grow"><div style="font-weight:600" class="dim">通常申込</div>
        <div class="dim" style="font-size:12px">${esc(c.rel.label)} は対象メンバーが完売済み</div></div>
      <div class="pill info" style="font-size:13px;padding:5px 11px">完売</div></div>`;
  }else{
    const ph=lotteryPhase(L,now);
    const sub = ph.key==="open"   ? `${DOW_LABEL[L.close_dow]} ${L.close_time} まで受付中`
              : ph.key==="result" ? `${DOW_LABEL[L.result_dow]} ${L.result_time} 発表 → 記録を入力`
              : `${DOW_LABEL[L.open_dow]} ${L.open_time} 開始 → ${DOW_LABEL[L.close_dow]} ${L.close_time} 締切`;
    h+=`<div class="row" style="padding:10px 0">
      <div class="grow">
        <div style="font-weight:600">${esc(ph.title)}</div>
        <div class="dim" style="font-size:12px">${esc(sub)}</div>
      </div>
      <div class="pill ${ph.cls}" style="font-size:13px;padding:5px 11px;font-variant-numeric:tabular-nums">
        あと ${untilStr(ph.at-now)}</div>
    </div>`;
  }
  box.innerHTML=h;
}

/* =========================================================================
   TAB: 一覧 (リリース・グリッド)  ★閲覧専用
   行=部 / 列=開催日 のマトリクス。10年運用してきたスプレッドシートの
   「開催日シート」(行=部 / 列=メンバー)を、列を開催日に置き換えた形。
   1リリース分の保有枚数が1画面に収まる。
   数値の編集はここでは行わない(誤操作防止)。編集は「記録」タブ。
   ========================================================================= */
let gridReleaseId=null, gridMemberId=null, gridMode="hold";   // hold=保有 / score=成績

// 部番号の固定色(スプレッドシートの 1赤 2橙 3黄 4緑 5青 を踏襲)
const BU_COLORS=["#e2585a","#e08a3b","#d3bb3c","#4fb286","#5b8fd4","#a07ad0","#5ac8c8","#c98fa8"];
const buColor=n=>BU_COLORS[(n-1)%BU_COLORS.length];
const WD=["日","月","火","水","木","金","土"];
function mdw(ymd){
  const d=new Date(ymd+"T00:00:00"), g=d.getDay();
  return {md:`${d.getMonth()+1}/${d.getDate()}`, wd:WD[g],
          cls:g===0?"wd sun":g===6?"wd sat":"wd"};     // 日=赤 / 土=青
}
function closeModals(){ document.querySelectorAll(".modalwrap").forEach(w=>w.remove()); }

/* リリースの並び順。
   発売日順にすると、新曲が出ていないグループ(AKB等)のリリースが
   いつまでも先頭に居座ってしまう。実際に見たいのは「次の開催が近いもの」
   なので、これからの開催がある順 → 終わったものは新しい順、にする。 */
function releaseOrder(){
  const t=new Date();
  const ymd=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
  return DB.releases.map(r=>{
    const evs=eventsOf(r.id);
    const next=evs.find(e=>e.event_date>=ymd);
    return {r, next:next?next.event_date:null, last:evs.length?evs[evs.length-1].event_date:""};
  }).sort((a,b)=>{
    if(a.next&&b.next) return a.next<b.next?-1:1;              // 開催が近い順
    if(a.next!==null) return -1;
    if(b.next!==null) return 1;
    if(a.last!==b.last) return a.last>b.last?-1:1;             // 終わったものは新しい順
    return (b.r.release_date||"")>(a.r.release_date||"")?1:-1;
  });
}

// そのリリースに応募記録があるメンバーID一覧
function membersInRelease(rid){
  const set=new Set();
  eventsOf(rid).forEach(e=>membersInEvent(e.id).forEach(id=>set.add(id)));
  return [...set];
}

/* リリース × メンバー のグリッド用データ。
   cell["<event_id>:<bu_no>"] = {won, applied, rounds:[...], sess, ev} */
function gridData(rid, mid, type){
  const evs=eventsOf(rid).filter(e=>!type||e.event_type===type);
  const buSet=new Set(), times={}, cell={};
  evs.forEach(e=>{
    sessionsOf(e.id).forEach(s=>{
      buSet.add(s.bu_no);
      const t=s.start_time.slice(0,5);
      (times[s.bu_no]=times[s.bu_no]||{})[t]=(times[s.bu_no][t]||0)+1;
      const apps=DB.applications
        .filter(a=>a.session_id===s.id && (!mid || a.member_id===mid))
        .sort((a,b)=>a.round-b.round);
      if(!apps.length) return;
      const c=cell[e.id+":"+s.bu_no]={won:0,applied:0,comp:0,rounds:[],sess:s,ev:e};
      apps.forEach(a=>{
        c.won+=a.won||0; c.applied+=a.applied||0;
        if(isComp(a)) c.comp+=a.won||0;          // 無敵券分は内訳として別に持つ
        c.rounds.push({round:a.round,applied:a.applied||0,won:a.won||0,kind:a.kind||"lottery"});
      });
    });
  });
  const bus=[...buSet].sort((a,b)=>a-b);
  // 各部の代表時刻(最も多く使われている開始時刻)。開催日ごとに時刻が違っても1行で表せる。
  const repTime=bu=>{
    const t=Object.entries(times[bu]||{});
    return t.length ? t.sort((a,b)=>b[1]-a[1])[0][0] : "";
  };
  return {evs,bus,cell,repTime};
}

function renderGrid(){
  const el=$("#tab-grid");
  const ord=releaseOrder(), rels=ord.map(x=>x.r);
  if(!rels.length){
    el.innerHTML=`<h2 style="font-size:19px;margin:6px 0 12px">一覧</h2>
      <div class="card"><div class="empty"><span class="big">\u{1F4BF}</span>
      まだリリースがありません。<br>「記録」タブから追加してください。</div></div>`;
    return;
  }
  if(!gridReleaseId || !byId(DB.releases,gridReleaseId)) gridReleaseId=rels[0].id;
  const rel=byId(DB.releases,gridReleaseId);
  const mems=membersInRelease(gridReleaseId);
  if(!gridMemberId || !mems.includes(gridMemberId)){
    gridMemberId = mems.find(id=>byId(DB.members,id)?.is_oshi) || mems[0] || null;
  }

  let h=`<div class="row" style="margin:6px 0 12px">
    <h2 style="font-size:19px">一覧</h2>
    ${gridMemberId?`<span class="pill gold" style="margin-left:auto">${esc(memberName(gridMemberId))}</span>`:""}
  </div>`;

  // 選択UIはラベルなしの1行に。メンバーが複数いるリリースのときだけ2列。
  const relSel=`<select onchange="gridReleaseId=this.value;gridMemberId=null;renderGrid()">
      ${rels.map(r=>`<option value="${r.id}" ${r.id===gridReleaseId?"selected":""}>${esc(r.label)}</option>`).join("")}
    </select>`;
  const memSel=`<select onchange="gridMemberId=this.value;renderGrid()">
      ${mems.map(id=>`<option value="${id}" ${id===gridMemberId?"selected":""}>${esc(memberName(id))}${byId(DB.members,id)?.is_oshi?" ★":""}</option>`).join("")}
    </select>`;
  h+= mems.length>1 ? `<div class="grid2">${relSel}${memSel}</div>`
                    : `<div>${relSel}</div>`;
  // 選択中のリリースの状況(グループ名と次の開催)を1行で
  const oi=ord.find(x=>x.r.id===gridReleaseId);
  const gname=(byId(DB.groups,rel.group_id)||{}).name||"";
  const nx=oi&&oi.next;
  h+=`<div class="dim" style="font-size:11px;margin:6px 2px 12px">${esc(gname)}${nx
      ?` ・ 次の開催 ${mdw(nx).md}(${mdw(nx).wd}) まで あと ${daysLeft(nx)}日`
      :(oi&&oi.last?` ・ 開催は ${mdw(oi.last).md}(${mdw(oi.last).wd}) で終了`:"")}</div>`;

  h+=`<div class="segbar">
    <button class="${gridMode==="hold"?"on":""}" onclick="gridMode='hold';renderGrid()">保有</button>
    <button class="${gridMode==="score"?"on":""}" onclick="gridMode='score';renderGrid()">成績</button>
  </div>`;

  h += (gridMode==="score") ? gridScoreHtml(gridReleaseId,gridMemberId)
                            : gridHoldHtml(gridReleaseId,gridMemberId);
  el.innerHTML=h;
}

/* --- 保有モード ---
   種別ごとに表を分ける。個別は 5部制・10:00開始・90分進行(2部と3部の間だけ
   1時間休憩)、全国/リアルは 4部制・12:00開始・60分進行。部数も時刻も違うので
   同じ表に混ぜると「1部 10:00」のような嘘の行ができてしまう。 */
function gridHoldHtml(rid, mid){
  const all=eventsOf(rid);
  if(!all.length) return `<div class="card"><div class="empty">このリリースにはまだ開催日がありません。</div></div>`;
  const types=sortTypes([...new Set(all.map(e=>e.event_type))]);
  let h="", grand=0, grandComp=0;

  types.forEach(tp=>{
    const {evs,bus,cell,repTime}=gridData(rid,mid,tp);
    if(!evs.length||!bus.length) return;
    const colTot={}, rowTot={}; let tot=0, totComp=0;
    bus.forEach(bu=>rowTot[bu]=0);
    evs.forEach(e=>colTot[e.id]=0);
    bus.forEach(bu=>evs.forEach(e=>{
      const c=cell[e.id+":"+bu]; if(!c) return;
      rowTot[bu]+=c.won; colTot[e.id]+=c.won; tot+=c.won; totComp+=c.comp;
    }));
    grand+=tot; grandComp+=totComp;

    h+=`<div class="card">
      <div class="row" style="margin-bottom:10px">
        <span class="pill ${typePillClass(tp)}">${esc(typeLabel(tp))}</span>
        <span class="dim" style="font-size:11px;margin-left:8px">${bus.length}部制 ・ ${evs.length}日</span>
        <span style="margin-left:auto;font-weight:700;color:var(--acc)">${tot}枚</span>
      </div>
      <div class="gridwrap"><table class="mg"><thead><tr><th class="stick"></th>`;
    evs.forEach(e=>{
      const {md,wd,cls}=mdw(e.event_date);
      h+=`<th class="dt" onclick="openEvent('${e.id}')">${md}<span class="${cls}">${wd}</span></th>`;
    });
    h+=`<th class="tot">計</th></tr></thead><tbody>`;
    bus.forEach(bu=>{
      h+=`<tr><td class="stick"><span class="buchip" style="background:${buColor(bu)}"></span>${bu}部`
        +`<span class="butime">${repTime(bu)}</span></td>`;
      evs.forEach(e=>{
        const c=cell[e.id+":"+bu];
        h+= (c && c.won)
          ? `<td class="cell has" onclick="gridCell('${e.id}',${bu})">${c.won}`
            + (c.comp?`<span class="cdot" title="無敵券を含む"></span>`:"") + `</td>`
          : `<td class="zero">・</td>`;
      });
      h+=`<td class="tot ${rowTot[bu]?"has":"zero"}">${rowTot[bu]||"・"}</td></tr>`;
    });
    h+=`<tr class="sum"><td class="stick">計</td>`;
    evs.forEach(e=>h+=`<td>${colTot[e.id]||"・"}</td>`);
    h+=`<td class="tot" style="color:var(--acc)">${tot}</td></tr></tbody></table></div>`;
    if(totComp) h+=`<p class="dim" style="font-size:11px;margin:10px 0 0">
      <span class="cdot" style="position:static;display:inline-block;margin-right:4px"></span>は無敵券を含むセル(${totComp}枚)。</p>`;
    h+=`</div>`;
  });

  if(types.length>1){
    h+=`<div class="card"><div class="row">
      <span style="font-weight:600">総計</span>
      <span class="dim" style="font-size:11px;margin-left:8px">${types.map(t=>esc(typeLabel(t))).join(" + ")}</span>
      <span style="margin-left:auto;font-size:19px;font-weight:700;color:var(--acc)">${grand}枚</span>
    </div>${grandComp?`<div class="dim" style="font-size:11px;margin-top:6px">うち無敵券 ${grandComp}枚</div>`:""}</div>`;
  }
  h+=`<p class="dim" style="font-size:11px;margin:0 0 14px">数字は保有枚数。セルをタップで回次別の内訳、日付をタップで「記録」の詳細へ。このタブでは数値は変更されません。</p>`;
  return h;
}

/* --- セル詳細(回次別の内訳)。閲覧のみ --- */
function gridCell(eid,bu){
  const ev0=byId(DB.events,eid); if(!ev0) return;
  const {cell}=gridData(gridReleaseId,gridMemberId,ev0.event_type);
  const c=cell[eid+":"+bu]; if(!c) return;
  const s=c.sess, e=c.ev;
  const rows=c.rounds.map(r=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)">
      <span style="width:62px;font-weight:600;${r.kind==="comp"?"color:var(--acc)":""}">${r.kind==="comp"?"無敵券":r.round+"次"}</span>
      <span class="dim grow" style="font-size:12px">${r.kind==="comp"?"抽選なし":"申請 "+r.applied}</span>
      <span style="font-weight:700">${r.kind==="comp"?"":"当選 "}${r.won}</span></div>`).join("");
  openModal(`${formatDateDisp(e.event_date)}  ${bu}部`,`
    <div class="row" style="gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <span class="pill ${typePillClass(e.event_type)}">${esc(typeLabel(e.event_type))}</span>
      <span class="dim" style="font-size:12px">${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)}</span>
      <span class="pill close" style="margin-left:auto">締切 ${(s.receipt_close||"").slice(0,5)}</span>
    </div>
    <div class="dim" style="font-size:12px;margin-bottom:4px">${esc(memberName(gridMemberId))}</div>
    ${rows||`<div class="dim" style="font-size:13px">記録なし</div>`}
    <div class="row" style="padding:10px 0">
      <span class="grow"></span>
      <span style="font-weight:700;color:var(--acc)">合計 ${c.won}枚</span></div>
    ${s.topic?`<p class="dim" style="font-size:12px;margin:10px 0 0">\u{1F4AC} ${esc(s.topic)}</p>`:""}
    <button class="btn ghost" style="width:100%;margin-top:16px" onclick="closeModals();openEvent('${e.id}')">「記録」で編集する</button>
  `, async()=>true);
  ["mOk","mCancel"].forEach(id=>{ const b=document.getElementById(id); if(b) b.style.display="none"; });
}

/* --- 成績モード ---
   保有モードと同じく種別ごとに分ける。個別は申込(抽選)で、全国/リアルは
   先に買ったシリアルで応募するため、そもそも同じ土俵の数字ではない。 */
function gridScoreHtml(rid, mid){
  const all=eventsOf(rid);
  if(!all.length) return `<div class="card"><div class="empty">このリリースにはまだ開催日がありません。</div></div>`;
  const types=sortTypes([...new Set(all.map(e=>e.event_type))]);
  const pct=(w,a)=>a?(Math.round(w/a*1000)/10)+"%":"—";
  const col=(w,a)=>!a?"var(--txt3)":(w/a>=.5?"var(--ok)":w/a>=.3?"var(--warn)":"var(--danger)");
  let out="";

  types.forEach(tp=>{
    const evs=all.filter(e=>e.event_type===tp);
    const roundSet=new Set(), m={};
    evs.forEach(e=>sessionsOf(e.id).forEach(s=>{
      DB.applications.filter(a=>a.session_id===s.id && (!mid||a.member_id===mid) && !isComp(a)).forEach(a=>{
        roundSet.add(a.round);
        const r=(m[a.round]=m[a.round]||{});
        const c=(r[e.id]=r[e.id]||{applied:0,won:0});
        c.applied+=a.applied||0; c.won+=a.won||0;
      });
    }));
    const rs=[...roundSet].sort((a,b)=>a-b);
    if(!rs.length) return;
    out+=`<div class="row" style="margin:2px 0 8px">
      <span class="pill ${typePillClass(tp)}">${esc(typeLabel(tp))}</span></div>`;
    let cumA=0, cumW=0;
    rs.forEach((r,i)=>{
      const per=m[r]||{}; let sa=0,sw=0;
      out+=`<div class="card"><h3 style="color:var(--acc);text-transform:none;font-size:14px">${r}次</h3>
        <div class="gridwrap"><table class="mg"><thead><tr>
          <th class="stick">開催日</th><th>申請</th><th>当選</th><th class="tot">当選率</th>
        </tr></thead><tbody>`;
      evs.forEach(e=>{
        const c=per[e.id]||{applied:0,won:0};
        sa+=c.applied; sw+=c.won;
        const {md,wd,cls}=mdw(e.event_date);
        out+=`<tr><td class="stick">${md}<span class="butime ${cls}">${wd}</span></td>
          <td class="${c.applied?"":"zero"}">${c.applied||"・"}</td>
          <td class="${c.won?"has":"zero"}">${c.won||"・"}</td>
          <td class="tot" style="color:${col(c.won,c.applied)};font-weight:600">${pct(c.won,c.applied)}</td></tr>`;
      });
      cumA+=sa; cumW+=sw;
      out+=`<tr class="sum"><td class="stick">計</td><td>${sa}</td><td>${sw}</td>
        <td class="tot" style="color:${col(sw,sa)}">${pct(sw,sa)}</td></tr>`;
      if(i>0){
        out+=`<tr class="sum"><td class="stick" style="font-size:11px">${rs.slice(0,i+1).map(x=>x+"次").join("+")}</td>
          <td>${cumA}</td><td>${cumW}</td>
          <td class="tot" style="color:${col(cumW,cumA)}">${pct(cumW,cumA)}</td></tr>`;
      }
      out+=`</tbody></table></div></div>`;
    });
  });
  return out||`<div class="card"><div class="empty">このリリースの応募記録がありません。<br>「記録」タブで申請・当選を入力してください。</div></div>`;
}

/* =========================================================================
   TAB 3: 当選率 統計 … メンバー別・時間帯(部)別の歴代当選率
   応募行動は「特定メンバーの部」が単位。メンバーを選んで集計する。
   ========================================================================= */
let statsMemberId=null, statsType=null;   // null=未設定(データのある先頭種別を既定にする)
// 種別の表示順(頻度順): 個別オンライン→全国オンライン→リアルミーグリ→個別握手会→(カスタム各種)
const TYPE_ORDER=["kojin_online","zenkoku_online","real_meetgreet","kojin_akushu"];
function typeRank(t){
  const i=TYPE_ORDER.indexOf(t);
  if(i>=0) return i;
  // カスタム類は標準種別の後ろ。ユーザー定義は SETTINGS 登録順、旧"custom"は最後。
  if(t==="custom") return 100000;
  const ci=(SETTINGS.customTypes||[]).findIndex(c=>c.id===t);
  return ci>=0 ? (1000+ci) : 99999;
}
function sortTypes(arr){ return [...arr].sort((a,b)=>typeRank(a)-typeRank(b)); }
function membersWithData(){
  // 応募データがあるメンバーのみ(なければオシ→全員)
  const ids=[...new Set(DB.applications.map(a=>a.member_id))];
  if(ids.length) return DB.members.filter(m=>ids.includes(m.id));
  return DB.members;
}
// そのメンバーが「応募実績を持つ」種別一覧(統計用)。表示順でソート。
function statsTypesOfMember(mid){
  const set=new Set();
  DB.applications.filter(a=>a.member_id===mid).forEach(a=>{
    const ev=byId(DB.events,(byId(DB.sessions,a.session_id)||{}).event_id);
    if(ev) set.add(ev.event_type);
  });
  return sortTypes([...set]);
}
// そのメンバーの所属グループに「イベントが存在する」種別一覧(シミュ用)。表示順でソート。
function simTypesOfMember(mid){
  const m=byId(DB.members,mid); if(!m) return [];
  const relIds=DB.releases.filter(r=>r.group_id===m.group_id).map(r=>r.id);
  const set=new Set();
  DB.events.filter(e=>relIds.includes(e.release_id)).forEach(e=>set.add(e.event_type));
  return sortTypes([...set]);
}
function renderStats(){
  const el=$("#tab-stats");
  const cand=membersWithData();
  if(!statsMemberId || !cand.some(m=>m.id===statsMemberId)){
    statsMemberId=(cand.find(m=>m.is_oshi)?.id)||(cand[0]?.id)||null;
    statsType=null;   // メンバーが変わったら種別も再決定
  }

  let html=`<h2 style="font-size:19px;margin:6px 0 12px">歴代 当選率</h2>`;

  if(!statsMemberId){
    html+=`<div class="card"><div class="empty"><span class="big">\u{1F4CA}</span>
      まだ応募データがありません。<br>「記録」で対象メンバーの申請・当選を入力すると、メンバー別の当選率がここに出ます。</div></div>`;
    el.innerHTML=html; return;
  }

  // このメンバーが実績を持つ種別(表示順)。既定はその先頭。
  const types=statsTypesOfMember(statsMemberId);
  if(!types.length){
    // メンバー選択UIだけ出して、データなしを伝える
    html+=`<div class="card">
      <div class="field" style="margin-bottom:0"><label class="fld">対象メンバー</label>
        <select id="statsMember" onchange="statsMemberId=this.value;renderStats()">
          ${cand.map(m=>`<option value="${m.id}" ${m.id===statsMemberId?"selected":""}>${esc(m.name)}${m.is_oshi?" ★":""}</option>`).join("")}
        </select></div></div>
      <div class="card"><div class="empty">このメンバーの応募データがありません。</div></div>`;
    el.innerHTML=html; return;
  }
  if(!statsType || !types.includes(statsType)) statsType=types[0];

  // メンバー & 種別フィルタ(すべては廃止。実績のある種別のみ)
  html+=`<div class="card">
    <div class="field"><label class="fld">対象メンバー</label>
      <select id="statsMember" onchange="statsMemberId=this.value;renderStats()">
        ${cand.map(m=>`<option value="${m.id}" ${m.id===statsMemberId?"selected":""}>${esc(m.name)}${m.is_oshi?" ★":""}</option>`).join("")}
      </select></div>
    <div class="field" style="margin-bottom:0"><label class="fld">種別</label>
      <select id="statsType" onchange="statsType=this.value;renderStats()">
        ${types.map(k=>`<option value="${k}" ${statsType===k?"selected":""}>${esc(typeLabel(k))}</option>`).join("")}
      </select></div>
  </div>`;

  // 集計: 対象メンバー × 種別 の「部」別
  // 当選上限がある種別(全国/リアル)では、上限に届いた行から本当の当選率は読めない。
  // 「20枚入れて10枚当選」は50%に見えるが、実際は100%を上限で切られただけかもしれない。
  // そういう行(打ち止め)を分けて集計し、率は打ち止めでない行から出す。
  const statCap=typeRule(statsType).winCap;
  const byBu={};
  DB.sessions.forEach(s=>{
    const ev=byId(DB.events,s.event_id); if(!ev) return;
    if(ev.event_type!==statsType) return;
    DB.applications.filter(a=>a.session_id===s.id && a.member_id===statsMemberId && !isComp(a)).forEach(a=>{
      const v=(byBu[s.bu_no]=byBu[s.bu_no]||{applied:0,won:0,n:0,cap:0,uApplied:0,uWon:0,times:{}});
      v.applied+=a.applied||0; v.won+=a.won||0; v.n++;
      if(statCap!=null && (a.won||0)>=statCap) v.cap++;                       // 打ち止め
      else { v.uApplied+=a.applied||0; v.uWon+=a.won||0; }                    // 率に使える行
      const t=s.start_time.slice(0,5); v.times[t]=(v.times[t]||0)+1;
    });
  });
  // 各部の代表時刻(最も多く使われた開始時刻)
  const repTime=v=>{ const e=Object.entries(v.times); if(!e.length) return ""; return e.sort((a,b)=>b[1]-a[1])[0][0]; };
  const rows=Object.entries(byBu).map(([bu,v])=>{
    // 打ち止めの行しか無い部は、率ではなく下限(「これ以上」)しか言えない
    const bound=v.uApplied===0 && v.cap>0;
    const rate = v.uApplied ? v.uWon/v.uApplied : (v.applied? v.won/v.applied : null);
    return {bu:+bu,t:repTime(v),...v,rate,bound};
  }).filter(r=>r.applied>0 && r.rate!=null).sort((a,b)=>a.bu-b.bu);
  const capHits=rows.reduce((n,r)=>n+r.cap,0);

  if(!rows.length){
    html+=`<div class="card"><div class="empty">この条件の応募データがありません。</div></div>`;
    el.innerHTML=html; return;
  }
  const best=rows.reduce((a,b)=>(b.rate>a.rate?b:a));
  html+=`<div class="card" style="border-color:var(--acc-d)">
    <h3 style="color:var(--acc)">最も当たりやすい部</h3>
    <div style="font-size:26px;font-weight:700">${best.bu}部 ${best.t?`<span style="font-size:15px;color:var(--txt2)">(${best.t})</span>`:""} <span style="font-size:16px;color:var(--ok)">${best.bound?"≥":""}${Math.round(best.rate*100)}%</span></div>
    <div class="dim" style="font-size:12px">${esc(memberName(statsMemberId))} の応募実績より。同じ応募枚数ならこの部が有利な傾向です。</div></div>`;

  const max=Math.max(...rows.map(r=>r.rate));
  html+=`<div class="card"><h3>部別 当選率</h3>`;
  rows.forEach(r=>{
    const pct=Math.round(r.rate*100);
    const col=r.rate>=.5?'var(--ok)':r.rate>=.3?'var(--warn)':'var(--danger)';
    html+=`<div style="margin:11px 0">
      <div class="row" style="font-size:13px;margin-bottom:4px">
        <span style="font-weight:600;width:74px">${r.bu}部 ${r.t?`<span class="dim" style="font-weight:400">${r.t}</span>`:""}</span>
        <span class="dim grow" style="font-size:12px">当選${r.won}/申請${r.applied} ・ ${r.n}件${r.cap?` ・ <span style="color:var(--warn)">打ち止め${r.cap}件</span>`:""}</span>
        <span style="font-weight:700;color:${col}">${r.bound?"≥":""}${pct}%</span></div>
      <div style="height:8px;background:var(--bg2);border-radius:6px;overflow:hidden">
        <div style="height:100%;width:${(r.rate/max*100).toFixed(0)}%;background:${col};border-radius:6px"></div></div>
    </div>`;
  });
  if(capHits) html+=`<p class="dim" style="font-size:11px;margin:10px 0 0">この種別は1部あたり当選 ${statCap}枚 が上限です。上限に届いた回(打ち止め)は本当の当選率が読めないため、率の計算からは外しています。「≥」は下限しか出せない部です。</p>`;
  html+=`</div>`;

  // 回次別 当選率(対象メンバー)
  html+=`<div class="card"><h3>回次別 当選率 <span class="dim" style="font-weight:400;font-size:12px;text-transform:none">(${esc(memberName(statsMemberId))})</span></h3>`;
  const byRound={};
  DB.applications.filter(a=>a.member_id===statsMemberId && !isComp(a)).forEach(a=>{
    // 部未指定の行(過去データ移行分)は event_id 側から種別を引く
    const s=byId(DB.sessions,a.session_id);
    const ev=byId(DB.events, s?s.event_id:a.event_id);
    if(!ev || ev.event_type!==statsType) return;
    const v=(byRound[a.round]=byRound[a.round]||{applied:0,won:0,cap:0,uApplied:0,uWon:0});
    v.applied+=a.applied||0; v.won+=a.won||0;
    if(statCap!=null && (a.won||0)>=statCap) v.cap++;
    else { v.uApplied+=a.applied||0; v.uWon+=a.won||0; }
  });
  const rr=Object.entries(byRound).filter(([k,v])=>v.applied>0).sort((a,b)=>a[0]-b[0]);
  if(!rr.length){ html+=`<div class="dim" style="font-size:13px">データなし</div>`; }
  else rr.forEach(([round,v])=>{
    const bound=v.uApplied===0 && v.cap>0;
    const pct=Math.round((v.uApplied? v.uWon/v.uApplied : v.won/v.applied)*100);
    html+=`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)">
      <span style="font-weight:600;width:52px">${round}次</span>
      <span class="dim grow" style="font-size:12px">当選${v.won}/申請${v.applied}${v.cap?` ・ <span style="color:var(--warn)">打ち止め${v.cap}件</span>`:""}</span>
      <span style="font-weight:700">${bound?"≥":""}${pct}%</span></div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
}

/* =========================================================================
   TAB 4: 応募計算(シミュレーション)
   対象メンバーを選び、各部に応募枚数を割り振り、そのメンバーの
   歴代当選率から期待当選を試算する。
   ========================================================================= */
let simMemberId=null, simRound=1, simType=null;
function availableRounds(mid){
  // そのメンバーの応募データに存在する回次(なければ1〜2)
  const rs=[...new Set(DB.applications.filter(a=>a.member_id===mid).map(a=>a.round))].sort((a,b)=>a-b);
  return rs.length?rs:[1,2];
}
function renderSim(){
  const el=$("#tab-sim");
  const cand=membersWithData();
  if(!simMemberId || !cand.some(m=>m.id===simMemberId)){
    simMemberId=(cand.find(m=>m.is_oshi)?.id)||(cand[0]?.id)||null;
    simType=null;   // メンバーが変わったら種別も再決定
  }
  const rounds=simMemberId?availableRounds(simMemberId):[1,2];
  if(!rounds.includes(simRound)) simRound=rounds[0];
  // このメンバーの所属グループにイベントが存在する種別(表示順)。既定は先頭。
  const types=simMemberId?simTypesOfMember(simMemberId):[];
  if(!simType || !types.includes(simType)) simType=types[0]||null;

  let html=`<h2 style="font-size:19px;margin:6px 0 8px">応募シミュレーション</h2>
    <p class="dim" style="font-size:13px;margin:0 0 14px">対象メンバー・応募回次・種別を選び、各部に応募枚数を入れると、その回次の歴代当選率から期待当選を試算します。</p>`;

  html+=`<div class="card">
    <div class="field"><label class="fld">対象メンバー</label>
      <select id="simMember" onchange="simMemberId=this.value;renderSim()">
        ${(cand.length?cand:DB.members).map(m=>`<option value="${m.id}" ${m.id===simMemberId?"selected":""}>${esc(m.name)}${m.is_oshi?" ★":""}</option>`).join("")}
      </select></div>
    <div class="grid2">
      <div class="field" style="margin-bottom:0"><label class="fld">応募回次</label>
        <select id="simRound" onchange="simRound=+this.value;simBuild()">
          ${rounds.map(r=>`<option value="${r}" ${r===simRound?"selected":""}>${r}次</option>`).join("")}</select></div>
      <div class="field" style="margin-bottom:0"><label class="fld">種別</label>
        <select id="simType" onchange="simType=this.value;simBuild()">
          ${types.length?types.map(k=>`<option value="${k}" ${simType===k?"selected":""}>${esc(typeLabel(k))}</option>`).join("")
              :`<option value="">(イベントなし)</option>`}</select></div>
    </div>
    <div id="simRows" style="margin-top:12px"></div>
    <div class="grid3" style="margin-top:14px">
      ${miniStat("応募 合計","<span id='simApp'>0</span>枚")}
      ${miniStat("期待当選","<span id='simExp'>0.0</span>枚")}
      ${miniStat("期待当選率","<span id='simRate'>—</span>")}
    </div>
    <div class="row" id="simWasteBox" style="display:none;margin-top:12px;padding:10px 12px;background:var(--dangerbg);border-radius:10px">
      <span style="font-size:12px;color:var(--danger)">上限を超えて入れた分</span>
      <span class="grow"></span>
      <span id="simWaste" style="font-weight:700;color:var(--danger)">—</span>
    </div>
    <p class="dim" style="font-size:11px;margin:10px 0 0" id="simNote">当選率は選択メンバー・選択種別・選択回次の歴代実績(その部の実データ)のみで算出します。データの無い部は「データなし」と表示し、合計・期待当選の計算からは除外します。確率の目安です。</p>
  </div>`;
  el.innerHTML=html;
  simBuild();
}
function simBuild(){
  const type=($("#simType")||{}).value||simType;
  const box=$("#simRows"); if(!box) return;
  if(!type){ box.innerHTML=`<div class="empty" style="padding:20px">このメンバーの所属グループにイベントがありません。</div>`; simCalc(); return; }
  // 種別ごとの制度(当選上限・単価・支払いの向き)
  const rule=typeRule(type), cap=rule.winCap;

  // 選択メンバー × 選択種別 × 選択回次 の「部」別当選率を集計(種別で完全に分離)
  // 各部の代表時刻も保持(カスタムは実データの時刻を使うため)。
  const byBu={};
  if(simMemberId){
    DB.sessions.forEach(s=>{
      const ev=byId(DB.events,s.event_id); if(!ev) return;
      if(ev.event_type!==type) return;                 // ★種別フィルタ(他種別を混ぜない)
      DB.applications.filter(a=>a.session_id===s.id && a.member_id===simMemberId && a.round===simRound && !isComp(a)).forEach(a=>{
        const v=(byBu[s.bu_no]=byBu[s.bu_no]||{applied:0,won:0,cap:0,uApplied:0,uWon:0,times:{}});
        v.applied+=a.applied||0; v.won+=a.won||0;
        // 当選率タブと同じ補正: 上限に届いた回は率の計算から外す
        if(cap!=null && (a.won||0)>=cap) v.cap++;
        else { v.uApplied+=a.applied||0; v.uWon+=a.won||0; }
        const t=s.start_time.slice(0,5); v.times[t]=(v.times[t]||0)+1;
      });
    });
  }
  const repTime=v=>{ const e=Object.entries(v.times||{}); return e.length?e.sort((a,b)=>b[1]-a[1])[0][0]:""; };

  // 行(部)の構成:
  //  - 標準種別: TEMPLATESの固定スケジュール
  //  - ユーザー定義カスタム種別(ct_xxx): そのテンプレの部構成
  //  - 旧"custom": テンプレが無いので、実際に応募した部のみを実データから構成
  let rowsSpec;
  const ct=customTypeById(type);
  if(ct){
    rowsSpec=ct.sessions.map((s,i)=>({bu_no:i+1, k:s.start_time.slice(0,5)}));
  }else if(type==="custom"){
    rowsSpec=Object.keys(byBu).map(Number).sort((a,b)=>a-b)
      .map(bu=>({bu_no:bu, k:repTime(byBu[bu])}));
    if(!rowsSpec.length){
      box.innerHTML=`<div class="empty" style="padding:20px">この回次のカスタム応募データがありません。<br>「記録」で申請・当選を入力すると試算できます。</div>`;
      simCalc(); return;
    }
  }else{
    rowsSpec=buildSchedule(TEMPLATES[type]||TEMPLATES.kojin_online).map(s=>({bu_no:s.bu_no, k:s.start_time.slice(0,5)}));
  }

  box.dataset.payment=rule.payment||"post";
  box.dataset.unit=rule.unitPrice||0;
  const wb=$("#simWasteBox"); if(wb) wb.style.display=(cap!=null&&rule.payment==="pre")?"":"none";
  const note=$("#simNote");
  if(note) note.textContent = cap!=null
    ? `この種別は1部あたり当選 ${cap}枚 が上限です。上限に届くのに要る枚数を「目安」として出し、それを超えた分は当選に繋がりません`
      + (rule.payment==="pre"?"(先払いなので、そのまま無駄になります)。":"。")
      + " 当選率は選択メンバー・種別・回次の実績のみで算出します。"
    : "当選率は選択メンバー・選択種別・選択回次の歴代実績(その部の実データ)のみで算出します。データの無い部は「データなし」と表示し、合計・期待当選の計算からは除外します。確率の目安です。";

  box.innerHTML=rowsSpec.map((s)=>{
    const k=s.k;
    const v=byBu[s.bu_no];
    const hasData = !!(v && v.applied);
    const rate = !hasData ? null : (v.uApplied ? v.uWon/v.uApplied : v.won/v.applied);
    if(!hasData){
      return `<div class="simrow" style="border-bottom:1px solid var(--line);opacity:.65" data-nodata="1">
        <div class="row" style="padding:9px 0;gap:10px">
          <div style="width:70px"><div style="font-weight:600">${s.bu_no}部</div><div class="dim" style="font-size:11px">${k}</div></div>
          <input type="number" min="0" value="3" style="width:62px;text-align:center;padding:6px" disabled class="simInput">
          <span style="font-size:12px;color:var(--txt3);width:104px">データなし</span>
          <span class="grow" style="text-align:right;font-weight:700;color:var(--txt3)">期待 —</span>
        </div></div>`;
    }
    const col=rate>=.5?'var(--ok)':rate>=.3?'var(--warn)':'var(--danger)';
    const need=needForCap(rate,cap);
    return `<div class="simrow" style="border-bottom:1px solid var(--line)"
                 data-rate="${rate}" data-cap="${cap??""}" data-need="${need??""}">
      <div class="row" style="padding:9px 0 ${need!=null?"2px":"9px"};gap:10px">
        <div style="width:70px"><div style="font-weight:600">${s.bu_no}部</div><div class="dim" style="font-size:11px">${k}</div></div>
        <input type="number" min="0" value="3" style="width:62px;text-align:center;padding:6px" oninput="simCalc()" class="simInput">
        <span style="font-size:12px;color:${col};width:104px">当選率 ${Math.round(rate*100)}%</span>
        <span class="grow" style="text-align:right;font-weight:700">期待 <span class="expCell">0.0</span></span>
      </div>
      ${need!=null?`<div class="hint dim" style="font-size:11px;padding:0 0 8px 80px"></div>`:""}
    </div>`;
  }).join("");
  simCalc();
}
function simCalc(){
  const box=$("#simRows"); if(!box) return;
  const pay=box.dataset.payment, unit=+box.dataset.unit||0;
  let totA=0,totE=0,totOver=0;
  box.querySelectorAll(".simrow").forEach(r=>{
    if(r.dataset.nodata) return;                  // データなしの部は合計に含めない
    const rate=+r.dataset.rate;
    const cap =r.dataset.cap ==="" ? null : +r.dataset.cap;
    const need=r.dataset.need==="" ? null : +r.dataset.need;
    const v=+r.querySelector(".simInput").value||0;
    let e=v*rate;
    if(cap!=null) e=Math.min(e,cap);              // 制度上ありえない期待値を出さない
    totA+=v; totE+=e;
    r.querySelector(".expCell").textContent=e.toFixed(1);
    const over=(need!=null && v>need) ? v-need : 0;
    totOver+=over;
    const hint=r.querySelector(".hint");
    if(hint&&need!=null) hint.innerHTML=`上限 ${cap}枚 ・ 目安 ${need}枚で到達`
      + (over?` ・ <span style="color:var(--danger);font-weight:600">過剰 ${over}枚</span>`:"");
  });
  $("#simApp").textContent=totA;
  $("#simExp").textContent=totE.toFixed(1);
  $("#simRate").textContent=totA?Math.round(totE/totA*100)+"%":"—";
  const w=$("#simWaste");
  if(w) w.textContent = totOver ? (pay==="pre"&&unit ? `${totOver}枚 ・ ${yen(totOver*unit)}` : `${totOver}枚`) : "なし";
}

function openModal(title,bodyHtml,onOk){
  const wrap=document.createElement("div");

  wrap.style.cssText="position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:0";
  wrap.innerHTML=`<div style="background:var(--card);border:1px solid var(--line2);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 18px calc(20px + env(safe-area-inset-bottom))">

      <button class="btn sm ghost" style="margin-left:auto" id="mClose">閉じる</button></div>
    <div id="mBody">${bodyHtml}</div>
    <div class="row" style="margin-top:16px;gap:8px">
      <button class="btn ghost grow" id="mCancel">キャンセル</button>
      <button class="btn primary grow" id="mOk">保存</button></div>
  </div>`;
  document.body.appendChild(wrap);

  wrap.querySelector("#mClose").onclick=close;

}

/* =========================================================================
   データ編集(グループ/メンバーの 改名・オシ変更・削除)
   使用頻度の低い管理機能なので常時表示せず、設定カードから開く。

function openDataEditor(){

function dataEditorBody(){
  const groups=DB.groups.sort((a,b)=>a.sort_order-b.sort_order);
  if(!groups.length){
    return `<div class="empty">グループがありません。「記録」からリリースを追加すると作成されます。</div>`;

      <div class="row" style="gap:6px;margin-bottom:8px">
        <input type="text" value="${esc(g.name)}" id="ge_${g.id}" style="font-size:14px;font-weight:600;padding:7px 9px"
          onchange="renameGroup('${g.id}',this.value)">
        <button class="btn sm ghost danger" style="white-space:nowrap" onclick="deleteGroup('${g.id}')">グループ削除</button>
      </div>
      <div class="dim" style="font-size:11px;margin-bottom:8px">リリース ${relCount}件 ・ メンバー ${mem.length}名</div>`;
    // メンバー一覧
    if(mem.length){
      mem.forEach(m=>{
        h+=`<div class="row" style="gap:6px;padding:4px 0">
          <button class="btn sm ghost" style="padding:5px 8px;${m.is_oshi?'color:var(--acc);border-color:var(--acc-d)':''}"
            title="オシ指定の切替" onclick="toggleOshi('${m.id}')">${m.is_oshi?"★":"☆"}</button>
          <input type="text" value="${esc(m.name)}" id="me_${m.id}" class="grow" style="font-size:13px;padding:6px 9px"
            onchange="renameMember('${m.id}',this.value)">
          <button class="btn sm ghost danger" style="padding:5px 9px" onclick="deleteMember('${m.id}')">×</button>
        </div>`;
      });
    }else{
      h+=`<div class="dim" style="font-size:12px;padding:4px 0">メンバーなし</div>`;
    }
    // --- カスタム種別(ユーザー定義テンプレ) ---
    const cts=customTypesOfGroup(g.id);
    h+=`<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
      <div class="dim" style="font-size:11px;margin-bottom:6px">カスタム種別(進行スケジュールのテンプレ)</div>`;
    if(cts.length){
      cts.forEach(ct=>{
        h+=`<div class="row" style="gap:6px;padding:4px 0">
          <span class="grow" style="font-size:13px">${esc(ct.name)} <span class="dim">(${ct.sessions.length}部)</span></span>
          <button class="btn sm ghost" style="padding:5px 9px" onclick="editCustomType('${g.id}','${ct.id}')">編集</button>
          <button class="btn sm ghost danger" style="padding:5px 9px" onclick="deleteCustomType('${g.id}','${ct.id}')">×</button>
        </div>`;
      });
    }else{
      h+=`<div class="dim" style="font-size:12px;padding:2px 0">なし</div>`;
    }
    h+=`<button class="btn sm ghost" style="margin-top:6px" onclick="editCustomType('${g.id}',null)">＋ カスタム種別を追加</button>
      </div>`;
